<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡報</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Noto Sans TC", sans-serif;
      background: #050810;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 80px 24px 48px;
    }
    h1 {
      font-size: clamp(40px, 5vw, 64px);
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 15px;
      color: #64748b;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 56px;
    }
    .table-wrap {
      width: 100%;
      max-width: 900px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 17px;
    }
    thead tr {
      border-bottom: 1px solid #1e293b;
    }
    th {
      text-align: left;
      padding: 14px 24px;
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 500;
    }
    td {
      padding: 22px 24px;
      border-bottom: 1px solid #0f172a;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #0d1326; }
    .num {
      font-family: monospace;
      color: #475569;
      font-size: 15px;
    }
    .name { font-weight: 700; color: #f1f5f9; font-size: 18px; }
    .tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 12px;
      vertical-align: middle;
    }
    .tag-warm  { background: rgba(20,184,166,0.2); color: #2dd4bf; border: 1px solid rgba(20,184,166,0.4); }
    .tag-vivid { background: rgba(139,92,246,0.2); color: #a78bfa; border: 1px solid rgba(139,92,246,0.4); }
    a.link {
      color: #a78bfa;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
    }
    a.link:hover { color: #c4b5fd; text-decoration: underline; }
    .date { font-family: monospace; font-size: 15px; color: #64748b; }
    .footer {
      margin-top: 56px;
      font-family: monospace;
      font-size: 12px;
      color: #1e293b;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <h1>簡報</h1>
  <div class="subtitle">EasonTsai · 網站技術課</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>簡報名稱</th>
          <th>連結</th>
          <th>建立日期</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="num">01</td>
          <td class="name">
            AI 協作推動實戰觀察
            <span class="tag tag-warm">暖色 Keynote</span>
          </td>
          <td><a class="link" href="20260612-ai-collab-report/">前往簡報 →</a></td>
          <td class="date">2026-06-12</td>
        </tr>
        <tr>
          <td class="num">02</td>
          <td class="name">
            AI 協作推動實戰觀察（圖像版）
            <span class="tag tag-vivid">Vivid Dark</span>
          </td>
          <td><a class="link" href="20260612-ai-collab-report-pic/">前往簡報 →</a></td>
          <td class="date">2026-06-06</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="footer">BLACKJTSAI · WEB-VIDEO-COMPANY-REPORT</div>
</body>
</html>
