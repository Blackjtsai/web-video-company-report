name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build ai-collab-report (暖色版)
        run: |
          cd site/20260612-ai-collab-report/src
          npm ci
          npm run build

      - name: Build ai-collab-report-pic (Vivid Dark 版)
        run: |
          cd site/20260612-ai-collab-report-pic/src
          npm ci
          npm run build

      - name: Assemble deploy folder
        run: |
          mkdir -p deploy/20260612-ai-collab-report
          mkdir -p deploy/20260612-ai-collab-report-pic
          cp -r site/20260612-ai-collab-report/src/dist/. deploy/20260612-ai-collab-report/
          cp -r site/20260612-ai-collab-report-pic/src/dist/. deploy/20260612-ai-collab-report-pic/
          cp index.html deploy/index.html

      - uses: actions/configure-pages@v4
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
